      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inventorymate?currentSchema=audit
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres123
      SPRING_DATA_MONGODB_URI: mongodb+srv://harshibabu604:harshibabu604@cluster0.uayo1rp.mongodb.net/?appName=Cluster0/audit_logs_db?authSource=admin
      
    networks:
      - inventorymate-net

  frontend:
    build: ../../inventorymate-frontend
    container_name: frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - user-service
    networks:
      - inventorymate-net

# ── Volumes ───────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local

# ── Networks ──────────────────────────────────────────────
networks:
  inventorymate-net:
    driver: bridge
