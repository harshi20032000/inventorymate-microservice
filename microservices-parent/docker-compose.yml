version: '3.8'

services:

  # ── Database ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: inventorymate-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: inventorymate
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    volumes:
      # persistent data — survives container restarts
      - postgres_data:/var/lib/postgresql/data
      # init scripts — run once on first startup
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventorymate"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inventorymate-net

  # ── Infrastructure ────────────────────────────────────────
  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    restart: unless-stopped
    ports:
      - "8761:8761"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - inventorymate-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Services ──────────────────────────────────────────────
  user-service:
    build: ./user
    container_name: user-service
    restart: unless-stopped
    ports:
      - "5007:5007"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inventorymate?currentSchema=user
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres123
      
    networks:
      - inventorymate-net

  order-service:
    build: ./order
    container_name: order-service
    restart: unless-stopped
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inventorymate?currentSchema=order
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres123
      
    networks:
      - inventorymate-net

  party-service:
    build: ./party
    container_name: party-service
    restart: unless-stopped
    ports:
      - "5002:5002"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inventorymate?currentSchema=party
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres123
      
    networks:
      - inventorymate-net

  payment-service:
    build: ./payment
    container_name: payment-service
    restart: unless-stopped
    ports:
      - "5003:5003"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inventorymate?currentSchema=payment
